info:
  name: Scripted Echo
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/echo"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {"greeting": "{{requestVar}}", "token": "{{token}}"}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("requestVar", "hello");
    - type: after-response
      code: |-
        bru.setVar("responseId", res.body.id);
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.status).to.equal(200);
        });
        test("id is returned", function () {
          expect(res.body.id).to.be.ok;
        });
